# Copy to a private config file. This is the GATEWAY profile, not the browser
# workbench profile. It never exposes /admin, /dashboard or /prism routes.
# Set OAI_PRISM_API_KEYS to a random downstream channel key before starting.
# Supply your own authorized upstream credentials in the separately mounted file.
# Context/cache behavior: ../CONTEXT_CACHE.md; Codex/catalog: ../CODEX_GATEWAY.md
server:
  host: 127.0.0.1
  port: 8787
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 0s
  idle_timeout: 120s
  max_header_bytes: 65536
  max_body_bytes: 12582912
  cors_origin: ""

upstream:
  # Existing transport service must be running and reachable from this process.
  # This configuration does NOT provision a browser/oracle or bypass upstream access controls.
  base_url: http://127.0.0.1:8790
  timeout: 0s
  dial_timeout: 10s
  tls_handshake_timeout: 10s
  response_header_timeout: 120s
  insecure_skip_verify: false
  max_retries: 0
  force_http2: false

creds:
  mode: file
  file: /var/lib/oaiprism/accounts.json
  reload_interval: 5s
  auto_refresh: true
  persist_refresh: false
  accounts: []

pool:
  strategy: least_inflight
  health_check: true
  max_wait: 5s
  cooldown: 60s

facade:
  enabled: true
  api_keys: [] # Required through OAI_PRISM_API_KEYS; empty keys prevent gateway startup.
  # Replace the upstream model value with a model you have actually validated.
  default_model: prism-text
  models:
    prism-text:
      model: REPLACE_WITH_VERIFIED_PRISM_MODEL
      reasoning_effort: medium
  default_system_prompt: ""
  use_sandbox: true
  reuse_project: false
  max_poll_timeout: 6m
  sync_timeout: 6m
  poll_interval: 1s
  poll_backoff_max: 5s
  rate_per_second: 2
  rate_burst: 4
  gateway:
    enabled: true
    timeout: 6m
    max_concurrent: 8
    usage_policy: estimate
    # These are explicit compatibility emulations, not upstream-native capabilities.
    prompt_tools: true
    structured_output: true
    local_output_limit: true
    # Enable for the tested Codex 0.160.0 function/custom/namespace contract.
    # Client tools remain client-owned; this does not grant server execution.
    codex_tools: false
    catalog:
      refresh_interval: 5m
      max_age: 1h
      publish: [] # Explicit public model IDs; discovery never changes NewAPI prices.
      sources: [] # One operator-owned source per existing account-pool ID.
      # Example only after observing authorized metadata (see CODEX_GATEWAY.md):
      # sources:
      #   - name: account-a-models
      #     account_id: YOUR_EXISTING_ACCOUNT_POOL_ID
      #     path: /var/lib/oaiprism/catalog/account-a.json
      # publish: [YOUR_OBSERVED_PUBLIC_MODEL_ID]
    # Images require authoritative upstream usage. Enable after a live contract check.
    # Context-budget estimation with images is deliberately unsupported.
    inline_images: false
    # Safe default when NewAPI shares one channel key across end users:
    response_store: false
    tenant_header: ""
    trusted_peers: []
    store_path: ""
    store_key_env: ""
    context:
      # Must configure verified window_tokens or model_windows before enabling.
      enabled: false
      window_tokens: 0
      model_windows: {}
      output_reserve: 4096
      safety_margin: 1024
      auto_compact: false
      trigger_tokens: 0 # 0 means 80% of the effective input budget.
      keep_last_turns: 4
      summary_tokens: 1024
      max_summary_calls: 8
      # A separate retention feature; store:false does not turn this off.
      # Requires trusted tenant_header + trusted_peers before enabling.
      summary_cache: false
      cache_ttl: 30m
    prompt_cache:
      # Account affinity only; never shares a mutable workspace or cached answer.
      affinity: true
      # Add public model aliases only after verifying native fields on the transport.
      native_models: []

# To enable response storage or summary caching, an authenticated reverse proxy
# MUST overwrite the chosen tenant header with the real verified user ID.
# Never forward a client-supplied value unchanged or use one static tenant for all.
# Example identity/storage overrides, only after this contract is established:
#   response_store: true
#   tenant_header: X-Verified-Tenant
#   trusted_peers: ["127.0.0.1/32"]
#   store_path: /var/lib/oaiprism/responses.sqlite
#   store_key_env: OAI_PRISM_RESPONSE_STORE_KEY
# The referenced environment variable must contain base64 of 32 random bytes.

capture:
  enabled: false
metrics:
  enabled: true
  health: /healthz
  ready: /readyz
  path: /metrics
log:
  level: info
  format: json
