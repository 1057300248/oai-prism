name: Gateway Final Source Check
on:
  push:
    branches: [codex/newapi-native-hardening-20261003]
    paths: [.github/workflows/gateway-cleanup.yml]
permissions:
  contents: write
jobs:
  finish:
    if: github.repository == '1057300248/oai-prism'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Final bounded admission and hygiene
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          p=Path('internal/gateway/handler.go')
          text=p.read_text()
          start=text.index('\tselect {\n\tcase h.slots <- struct{}{}:')
          end=text.index('\ttimeout := h.options.Timeout',start)
          gate=text[start:end]
          assert gate.count('h.slots')==2
          text=text[:start]+text[end:]
          anchor='func (h *Handler) generate(w http.ResponseWriter, r *http.Request, owner string, responses bool) {\n'
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+'\t// Bound request-body allocation and schema compilation, not just inference.\n'+gate)
          p.write_text(text)
          for name in ['.github/workflows/gateway-integrate.yml','.github/workflows/gateway-workbench.yml','.github/workflows/gateway-finalize.yml','.github/workflows/gateway-cleanup.yml','tools/gateway_integrate.py']:
              Path(name).unlink()
          PY
          gofmt -w internal/gateway internal/prism/usage_validation_test.go
          git diff --check
      - name: Commit final source and remove transient write workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/gateway internal/prism/usage_validation_test.go .github/workflows tools/gateway_integrate.py
          git commit -m 'fix(gateway): bound ingress work and finalize cloud-tested source'
          git push origin HEAD:refs/heads/codex/newapi-native-hardening-20261003
          git rev-parse HEAD > final-source-commit.txt
      - name: Full verification
        run: |
          set -euo pipefail
          go vet ./...
          go test -timeout 120s -count=1 -json ./... > gateway-tests.jsonl
          go test -timeout 180s -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/oaiprism-linux-amd64 ./cmd/oaiprism
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/oaiprism-linux-arm64 ./cmd/oaiprism
      - name: Evidence summary
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('gateway-tests.jsonl')
          events=[json.loads(x) for x in p.read_text().splitlines()] if p.exists() else []
          counts={a:sum(e.get('Action')==a and bool(e.get('Test')) for e in events) for a in ['pass','fail','skip']}
          print(counts)
          for e in events:
              if e.get('Action')=='fail' or '--- FAIL' in e.get('Output','') or 'panic:' in e.get('Output',''):print(e)
          pathlib.Path('test-counts.json').write_text(json.dumps(counts))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-final-source-evidence
          path: |
            final-source-commit.txt
            gateway-tests.jsonl
            test-counts.json
          retention-days: 3
