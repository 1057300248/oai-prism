name: Finalize Gateway Candidate
on:
  push:
    branches: [codex/newapi-native-hardening-20261003]
    paths: [.github/workflows/gateway-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == '1057300248/oai-prism'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Guarded semantic corrections
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          files={}
          def edit(path,old,new,n=1):
              text=files.get(path,Path(path).read_text())
              assert text.count(old)==n,(path,text.count(old),old[:80])
              files[path]=text.replace(old,new)
          edit('internal/gateway/store.go','type Snapshot struct {\n','type Snapshot struct {\n\tInputItems []Item `json:"input_items"`\n')
          edit('internal/gateway/handler.go','\t\t\twriteJSON(w, 200, map[string]any{"object": "list", "data": snapshot.Items, "has_more": false})','\t\t\tpage, err := inputItemsPage(snapshot, r.URL.Query())\n\t\t\tif err != nil { h.fail(w,r,nil,err); return }\n\t\t\twriteJSON(w, 200, page)')
          edit('internal/gateway/handler.go','\traw, _ := json.Marshal(q.Items)','\tfor i := range q.Items { if q.Items[i].ID == "" { q.Items[i].ID = "item_" + uuid.NewString() } }\n\traw, _ := json.Marshal(q.Items)')
          edit('internal/gateway/handler.go','Snapshot{Response: raw, Items: history}','Snapshot{Response: raw, Items: history, InputItems: append([]Item(nil), q.Items...)}')
          edit('internal/gateway/handler.go','\tif r.Context().Err() != nil {\n\t\treturn\n\t}\n\tapi := publicError(err)','\tif r.Context().Err() != nil {\n\t\treturn\n\t}\n\tapi := publicError(err)') if False else None
          edit('internal/facade/runner.go','\t\tlease.Release()\n\n\t\tif err == nil {','\t\tlease.Release()\n\t\tif err == nil && res == nil { err = errors.New("upstream returned no result") }\n\t\tif err == nil && res.Usage != nil && res.Usage.Invalid { err = errors.New("invalid upstream usage") }\n\n\t\tif err == nil {')
          edit('internal/server/gateway_e2e_test.go','if r.URL.Path=="/api/projects"{<-r.Context().Done();','if r.URL.Path=="/api/projects"{_,_ = io.Copy(io.Discard,r.Body);<-r.Context().Done();')
          # Do not misclassify normal project startup retries in the cancellation fixture.
          for path,text in files.items():Path(path).write_text(text)
          print('Corrected',len(files),'files')
          PY
          gofmt -w internal/gateway internal/server/gateway_e2e_test.go internal/facade/runner.go tools/gateway-fixture/main.go
      - name: Commit cloud candidate
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/gateway internal/server/gateway_e2e_test.go internal/facade/runner.go tools/gateway-fixture/main.go
          git commit -m 'fix(gateway): correct input pagination, usage validation and cancellation fixture'
          git push origin HEAD:refs/heads/codex/newapi-native-hardening-20261003
          git rev-parse HEAD
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          go vet ./...
          go test -timeout 120s -count=1 -v ./internal/gateway ./internal/server ./internal/prism
          go test -timeout 180s -race ./...
          CGO_ENABLED=0 go build -o /tmp/oaiprism ./cmd/oaiprism
