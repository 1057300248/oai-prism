name: Gateway Cloud Verification
on:
  push:
    branches: [codex/newapi-native-hardening-20261003]
  pull_request:
    paths: ['internal/**', 'tools/gateway_*', '.github/workflows/gateway-cloud.yml']
permissions:
  contents: read
concurrency:
  group: gateway-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go checks
        run: |
          set -euo pipefail
          go vet ./...
          go test -json ./... > gateway-tests.jsonl
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/oaiprism ./cmd/oaiprism
      - name: Export source and offline Go module cache for review
        if: always()
        run: |
          mkdir -p /tmp/gateway-review
          git archive --format=tar HEAD | gzip > /tmp/gateway-review/source.tar.gz
          cp gateway-tests.jsonl /tmp/gateway-review/ 2>/dev/null || true
          go version > /tmp/gateway-review/toolchain.txt
          go list -m all > /tmp/gateway-review/modules.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-review-${{ github.sha }}
          path: /tmp/gateway-review/
          retention-days: 3
