name: Integrate Gateway Source
on:
  push:
    branches: [codex/newapi-native-hardening-20261003]
    paths: [tools/gateway_integrate.py, .github/workflows/gateway-integrate.yml]
permissions:
  contents: write
concurrency:
  group: gateway-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == '1057300248/oai-prism'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Guarded source integration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/gateway_integrate.py
          go mod edit -require=github.com/santhosh-tekuri/jsonschema/v6@v6.0.2 -require=github.com/tiktoken-go/tokenizer@v0.8.1
          go mod tidy
          gofmt -w internal/gateway internal/facade/gateway_adapter.go internal/prism/usage.go internal/config/config.go internal/server/server.go internal/middleware/middleware.go internal/facade/types.go internal/facade/chat.go internal/facade/runner.go internal/prism/types.go internal/prism/client.go
      - name: Commit actual source without touching production or master
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/gateway internal/facade/gateway_adapter.go internal/prism/usage.go internal/config/config.go internal/server/server.go internal/middleware/middleware.go internal/facade/types.go internal/facade/chat.go internal/facade/runner.go internal/prism/types.go internal/prism/client.go go.mod go.sum
          git commit -m 'feat: integrate isolated NewAPI gateway and harden shared execution lifecycle'
          git push origin HEAD:refs/heads/codex/newapi-native-hardening-20261003
          git rev-parse HEAD > verified-candidate.txt
      - name: Verify exact committed candidate
        run: |
          set -euo pipefail
          go vet ./...
          go test -json ./... > gateway-tests.jsonl
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/oaiprism ./cmd/oaiprism
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-integration-evidence
          path: |
            verified-candidate.txt
            gateway-tests.jsonl
          retention-days: 3
