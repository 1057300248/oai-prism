name: Files and Media Integration
on:
  push:
    branches: [codex/newapi-native-hardening-20261003]
    paths: [.github/workflows/media-integrate.yml]
permissions:
  contents: write
concurrency:
  group: media-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == '1057300248/oai-prism'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Integrate bounded media support
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/media_integrate.py
          python - <<'PY'
          from pathlib import Path
          p=Path('internal/gateway/attachments.go')
          s=p.read_text();old='q.Items=items\n return nil';assert s.count(old)==1
          p.write_text(s.replace(old,'q.Items=items\n if q.HasMedia{return h.filterMediaAccounts(q,images>0,pdfs>0)}\n return nil'))
          PY
          go mod edit -require=golang.org/x/image@v0.42.0
          go mod tidy
          gofmt -w internal/attachment internal/gateway internal/prism/types.go internal/facade/gateway_adapter.go
          git diff --check
      - name: Static and full regression checks
        run: |
          set -euo pipefail
          go vet ./...
          go test -timeout 180s -count=1 -json ./... > media-tests.jsonl
      - name: Race and Linux builds
        run: |
          set -euo pipefail
          go test -timeout 240s -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/oaiprism-amd64 ./cmd/oaiprism
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/oaiprism-arm64 ./cmd/oaiprism
      - name: Commit verified source only
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/media_integrate.py .github/workflows/media-integrate.yml
          git add internal go.mod go.sum
          git commit -m 'feat: integrate tenant Files API and bounded image/PDF transport'
          git push origin HEAD:refs/heads/codex/newapi-native-hardening-20261003
          git rev-parse HEAD > verified-media-source.txt
      - name: Failure diagnostics and evidence
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('media-tests.jsonl')
          es=[json.loads(x) for x in p.read_text().splitlines()] if p.exists() else []
          counts={a:sum(e.get('Action')==a and bool(e.get('Test')) for e in es) for a in ['pass','fail','skip']}
          print('TEST COUNTS',counts)
          failed={e.get('Test') for e in es if e.get('Action')=='fail'}
          for e in es:
              if e.get('Test') in failed and e.get('Output'): print(e['Output'],end='')
          pathlib.Path('media-counts.json').write_text(json.dumps(counts))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: files-media-evidence
          path: |
            verified-media-source.txt
            media-counts.json
            media-tests.jsonl
          retention-days: 3
