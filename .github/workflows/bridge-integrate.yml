name: Bridge Transport Integration
on:
  push:
    branches: [codex/newapi-native-hardening-20261003]
    paths:
      - '.github/workflows/bridge-integrate.yml'
      - 'tools/bridge_upgrade.py'
      - 'tools/bridge-upgrade/**'
permissions:
  contents: write
concurrency:
  group: bridge-transport-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == '1057300248/oai-prism'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight and integrate exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/bridge_upgrade.py
          python - <<'PY'
          from pathlib import Path
          p=Path('internal/prism/gateway_transport.go')
          text=p.read_text()
          old='origin,_:=url.Parse(c.up.Origin);base,_:=url.Parse(c.up.BaseURL)'
          assert text.count(old)==2
          text=text.replace(old,'origin,_:=url.Parse(c.up.Origin);var base *url.URL;if c.base!=nil{base=c.base.BaseURL}')
          start=text.index('var actionPattern=')
          end=text.index('\n',start)
          text=text[:start]+'''var actionPattern=regexp.MustCompile(`createServerReference\s*\)?\s*\(\s*["']([0-9a-f]{20,128})["'][^()\r\n]{0,240}?["']createProjectConversation["']\s*\)`)'''+text[end:]
          p.write_text(text)
          PY
          gofmt -w internal/gateway internal/prism/gateway_transport.go internal/prism/gateway_transport_test.go internal/prism/types.go internal/prism/client.go internal/facade/gateway_adapter.go internal/facade/gateway_lifecycle.go internal/facade/gateway_lifecycle_test.go internal/facade/runner.go internal/server/server.go internal/server/bridge_e2e_test.go
          git diff --check
      - name: Focused bridge contracts
        run: |
          set -euo pipefail
          go test -timeout 60s -count=1 -v ./internal/gateway ./internal/prism ./internal/facade ./internal/server -run 'TestAdditionalTools|TestBridge|TestContinuation|TestRawGateway|TestRawUpload|TestCreateStoredConversation|TestStoredConversation|TestStartBudget|TestTerminalPayloadListenSnapshot|TestGatewayAccountEpoch|TestCapturedGatewayCursor|TestGatewayStageErrors'
      - name: Full regression and architecture builds
        run: |
          set -euo pipefail
          go vet ./...
          go test -timeout 180s -count=1 -json ./... > bridge-tests.jsonl
          go test -timeout 240s -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/oaiprism-amd64 ./cmd/oaiprism
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/oaiprism-arm64 ./cmd/oaiprism
      - name: Retest actual advanced client without production credentials
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/codex-tools" --save-exact @openai/codex@0.160.0
          python -m pip install openai==3.24.0
          go build -o "$RUNNER_TEMP/advanced-fixture" ./tools/codex-advanced-fixture
          export CODEX_CLI="$RUNNER_TEMP/codex-tools/node_modules/.bin/codex"
          export CODEX_ADVANCED_BIN="$RUNNER_TEMP/advanced-fixture"
          export CODEX_ADVANCED_EVIDENCE="$GITHUB_WORKSPACE/bridge-client-evidence"
          bash tools/codex_ci_sandbox.sh python tools/codex_advanced_test.py
      - name: Commit tested source and remove temporary write workflow
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          REMOTE=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$REMOTE" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r tools/bridge-upgrade tools/bridge_upgrade.py .github/workflows/bridge-integrate.yml
          git add internal/gateway internal/prism/gateway_transport.go internal/prism/gateway_transport_test.go internal/prism/types.go internal/prism/client.go internal/facade/gateway_adapter.go internal/facade/gateway_lifecycle.go internal/facade/gateway_lifecycle_test.go internal/facade/runner.go internal/server/server.go internal/server/bridge_e2e_test.go
          git diff --cached --check
          git commit -m 'feat(bridge): add tested upload profiles strict tool normalization and fenced continuation'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/newapi-native-hardening-20261003
          git rev-parse HEAD > bridge-source.txt
      - name: Test evidence summary
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('bridge-tests.jsonl')
          events=[json.loads(line) for line in p.read_text().splitlines()] if p.exists() else []
          counts={action:sum(e.get('Action')==action and bool(e.get('Test')) for e in events) for action in ['pass','fail','skip']}
          print('TEST COUNTS',counts)
          pathlib.Path('bridge-counts.json').write_text(json.dumps(counts))
          for e in events:
              if e.get('Action')=='fail' or '--- FAIL' in e.get('Output','') or 'panic:' in e.get('Output',''): print(e)
          p=pathlib.Path('bridge-client-evidence/summary.json')
          if p.exists():print(p.read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-transport-evidence
          path: |
            bridge-source.txt
            bridge-tests.jsonl
            bridge-counts.json
            bridge-client-evidence/
          retention-days: 3
