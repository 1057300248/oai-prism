name: Bridge Final Hardening
on:
  push:
    branches: [codex/newapi-native-hardening-20261003]
    paths: ['tools/bridge_finalize.py', '.github/workflows/bridge-finalize.yml']
permissions:
  contents: write
concurrency:
  group: bridge-final-hardening
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == '1057300248/oai-prism'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded corrections
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/bridge_finalize.py
          gofmt -w internal/gateway/context_compaction.go internal/gateway/continuation.go internal/gateway/bridge_final_test.go internal/facade/runner.go internal/facade/gateway_lifecycle.go internal/facade/gateway_lifecycle_test.go internal/facade/gateway_credential_test.go
          git diff --check
      - name: Canary offline tests
        run: python -m unittest discover -s tools -p test_bridge_canary.py -v
      - name: Go checks and architecture builds
        run: |
          set -euo pipefail
          go vet ./...
          go test -timeout 180s -count=1 -json ./... > bridge-final-tests.jsonl
          go test -timeout 240s -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/oaiprism-amd64 ./cmd/oaiprism
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/oaiprism-arm64 ./cmd/oaiprism
      - name: Commit exact tested files and remove temporary workflow
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          REMOTE=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$REMOTE" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/bridge_finalize.py .github/workflows/bridge-finalize.yml
          git add internal/gateway/context_compaction.go internal/gateway/continuation.go internal/gateway/bridge_final_test.go internal/facade/runner.go internal/facade/gateway_lifecycle.go internal/facade/gateway_lifecycle_test.go internal/facade/gateway_credential_test.go .github/workflows/gateway-sdk.yml
          git diff --cached --check
          git commit -m 'fix(bridge): fence credential changes and apply transport budgets to summaries'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/newapi-native-hardening-20261003
          git rev-parse HEAD > bridge-final-source.txt
      - name: Collect exact test evidence
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('bridge-final-tests.jsonl')
          events=[json.loads(line) for line in p.read_text().splitlines()] if p.exists() else []
          counts={action:sum(e.get('Action')==action and bool(e.get('Test')) for e in events) for action in ('pass','fail','skip')}
          print('TEST COUNTS',counts)
          pathlib.Path('bridge-final-counts.json').write_text(json.dumps(counts))
          for e in events:
              if e.get('Action')=='fail' or '--- FAIL' in e.get('Output','') or 'panic:' in e.get('Output',''):print(e)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-final-hardening-evidence
          path: |
            bridge-final-source.txt
            bridge-final-tests.jsonl
            bridge-final-counts.json
          retention-days: 3
