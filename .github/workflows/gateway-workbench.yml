name: Gateway Workbench
on:
  push:
    branches: [codex/newapi-native-hardening-20261003]
    paths: [.github/workflows/gateway-workbench.yml]
permissions:
  contents: read
jobs:
  offline-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare public dependencies and compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gateway-workbench"
          cp go.mod "$RUNNER_TEMP/offline.mod"
          cp go.sum "$RUNNER_TEMP/offline.sum"
          go mod edit -modfile="$RUNNER_TEMP/offline.mod" -require=github.com/santhosh-tekuri/jsonschema/v6@v6.0.2 -require=github.com/tiktoken-go/tokenizer@v0.8.1
          go mod download -modfile="$RUNNER_TEMP/offline.mod" all
          tar -C "$(go env GOROOT)" -czf "$RUNNER_TEMP/gateway-workbench/go.tar.gz" .
          tar -C "$(go env GOMODCACHE)" -czf "$RUNNER_TEMP/gateway-workbench/modules.tar.gz" .
          cp "$RUNNER_TEMP/offline.mod" "$RUNNER_TEMP/offline.sum" "$RUNNER_TEMP/gateway-workbench/"
          go version > "$RUNNER_TEMP/gateway-workbench/version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-public-tooling
          path: ${{ runner.temp }}/gateway-workbench/
          retention-days: 1
