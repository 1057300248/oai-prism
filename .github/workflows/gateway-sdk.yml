name: Official SDK Contract
on:
  push:
    branches: [codex/newapi-native-hardening-20261003]
  pull_request:
    paths: ['internal/**', 'tools/gateway*', 'tools/context*', 'tools/gateway-fixture/**', '.github/workflows/gateway-sdk.yml']
permissions:
  contents: read
concurrency:
  group: gateway-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned official SDKs
        run: |
          python -m pip install openai==3.24.0
          mkdir -p /tmp/gateway-node-sdk
          cd /tmp/gateway-node-sdk
          npm init -y >/dev/null
          npm install --ignore-scripts --save-exact openai@7.27.0
      - name: Test SDK protocols, context compaction and cache controls
        run: |
          set -euo pipefail
          go build -o /tmp/gateway-fixture ./tools/gateway-fixture
          /tmp/gateway-fixture > fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS -H 'Authorization: Bearer fixture-key' -H 'X-Fixture-Tenant: probe' http://127.0.0.1:18787/v1/models >/dev/null; then break; fi
            sleep 1
          done
          python tools/gateway_sdk_test.py 2>&1 | tee python-sdk.log
          python tools/context_sdk_test.py 2>&1 | tee python-context-sdk.log
          cp tools/gateway_sdk_test.mjs /tmp/gateway-node-sdk/test.mjs
          cp tools/context_sdk_test.mjs /tmp/gateway-node-sdk/context.mjs
          node /tmp/gateway-node-sdk/test.mjs 2>&1 | tee javascript-sdk.log
          node /tmp/gateway-node-sdk/context.mjs 2>&1 | tee javascript-context-sdk.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-sdk-evidence
          path: |
            fixture.log
            python-sdk.log
            javascript-sdk.log
            python-context-sdk.log
            javascript-context-sdk.log
          retention-days: 3
